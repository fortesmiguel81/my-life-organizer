services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: milo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.local}
      POSTGRES_DB: milo
    ports:
      # Loopback-only on the server, not the LAN — connect from other
      # machines via an SSH tunnel: ssh -N -L 5432:localhost:5432 <server>
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milo"]
      interval: 5s
      timeout: 5s
      retries: 10

  ntfy:
    image: binwiederhier/ntfy
    restart: unless-stopped
    command: serve
    ports:
      - "8080:80"
    volumes:
      - ntfy-data:/var/cache/ntfy

  migrate:
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    env_file: .env.local
    environment:
      DATABASE_URL: postgres://milo:${POSTGRES_PASSWORD}@postgres:5432/milo
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "drizzle-kit", "migrate"]

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file: .env.local
    environment:
      DATABASE_URL: postgres://milo:${POSTGRES_PASSWORD}@postgres:5432/milo
      NTFY_URL: http://ntfy:80
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads-data:/data/uploads
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  cron:
    image: alpine:3.20
    restart: unless-stopped
    env_file: .env.local
    environment:
      APP_URL: http://app:3000
    depends_on:
      - app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl >/dev/null
        while true; do
          curl -sf -X POST "$$APP_URL/api/notifications/process" -H "Authorization: Bearer $$CRON_SECRET" || true
          sleep 900
        done

volumes:
  postgres-data:
  ntfy-data:
  uploads-data:
